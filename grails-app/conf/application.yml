---
server:
  tomcat:
    basedir: gooweeapp/tomcat
  servlet:
    session:
      persistent: true
      store-dir: gooweeapp
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

---
javamelody:
  init-parameters:
    log: true
    storage-directory: ${user.dir}/gooweeapp/java-melody

---
spring:
  threads:
    virtual:
      enabled: true
  h2:
    console:
      enabled: true

---
hibernate:
  cache:
    queries: false
    use_second_level_cache: false
    use_query_cache: false

dataSource:
  pooled: true
  jmxExport: true
  driverClassName: org.h2.Driver
  url: jdbc:h2:file:./gooweeapp/gooweeapp;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
  username: sa
  password: ''

  properties:
    jmxEnabled: true
    initialSize: 5
    maxActive: 50
    minIdle: 5
    maxIdle: 25
    maxWait: 10000
    maxAge: 600000
    timeBetweenEvictionRunsMillis: 5000
    minEvictableIdleTimeMillis: 60000
    validationQuery: SELECT 1
    validationQueryTimeout: 3
    validationInterval: 15000
    testOnBorrow: true
    testWhileIdle: true
    testOnReturn: false
    jdbcInterceptors: ConnectionState
    defaultTransactionIsolation: 2 # TRANSACTION_READ_COMMITTED

environments:
  development:
    dataSource:
      dbCreate: update

  test:
    dataSource:
      dbCreate: update

  production:
    dataSource:
      dbCreate: update

info:
  app:
    name: '@info.app.name@'
    version: '@info.app.version@'
    grailsVersion: '@info.app.grailsVersion@'
grails:
  views:
    gsp:
      encoding: UTF-8
      codecs:
        scriptlet: html
  codegen:
    defaultPackage: demo
  profile: web

